<!DOCTYPE html>
<html>

<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="main">

   
        <div id="main1">

            <div id="quiz">

                <h1>Quiz App</h1>

                <p>Test your knowledge and have fun!</p>

                <p id="nameText">Enter your name:</p>

                <input
                    type="text"
                    id="name1"
                    placeholder="Your name here"
                >

                <button id="bt">
                    Start Quiz
                </button>

            </div>

        </div>


    
        <div id="main2">

            <div id="one">

                <h2 id="ques">
                    What is capital of India?
                </h2>

                <label>
                    <input
                        type="radio"
                        class="answer"
                        name="answer"
                        id="two"
                    >
                    <span id="twotext">Mumbai</span>
                </label>

                <label>
                    <input
                        type="radio"
                        class="answer"
                        name="answer"
                        id="three"
                    >
                    <span id="threetext">Delhi</span>
                </label>

                <label>
                    <input
                        type="radio"
                        class="answer"
                        name="answer"
                        id="four"
                    >
                    <span id="fourtext">Jaipur</span>
                </label>

                <label>
                    <input
                        type="radio"
                        class="answer"
                        name="answer"
                        id="five"
                    >
                    <span id="fivetext">MP</span>
                </label>

            </div>

            <button id="btn">
                Next
            </button>

        </div>


        <div id="main3">

            <div id="stud">

                <table id="stud1">

                    <tr>
                        <th>Name</th>
                        <th>Marks</th>
                    </tr>

                </table>

            </div>

        </div>

    </div>


    <script src="siddhi.js"></script>

</body>

</html>
